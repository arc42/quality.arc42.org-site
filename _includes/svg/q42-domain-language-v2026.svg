  <title id="domain-language-svg-title">Q42 domain language</title>
  <desc id="domain-language-svg-description">
    System or product quality is structured into nine quality dimensions and described by quality characteristics. Quality characteristics are associated with dimensions, specified by example requirements, related to standards, and enabled or improved by approaches. The nine dimension names and all six boxes are links.
  </desc>

