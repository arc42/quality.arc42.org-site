<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',-apple-system,'Segoe UI',sans-serif" role="img" aria-labelledby="tr-title tr-desc">
  <title id="tr-title">Tolerant Reader</title>
  <desc id="tr-desc">A producer's webhook payload grows from four fields (id, amount, currency, status) to six when fee_breakdown and risk_score are added later. The tolerant reader extracts only the four fields it uses by name, ignores the additions, and applies defaults for absent optional fields — the consumer keeps working without a deployment. A new enum value in a field the reader does read is treated as an error, never a silent default. Contract tests pin the extracted field set so producers know what they must preserve.</desc>

  <defs>
    <marker id="tr-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5fb49c"/>
    </marker>
  </defs>

  <!-- Producer box -->
  <rect x="60" y="46" width="300" height="296" rx="8" fill="#fff" stroke="#682d63" stroke-width="2.5"/>
  <text x="210" y="76" font-size="16" fill="#682d63" font-weight="700" text-anchor="middle">Producer</text>
  <text x="210" y="96" font-size="12" fill="#555" text-anchor="middle">payment webhook payload</text>

  <!-- Producer fields v1 -->
  <g font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="80" y="112" width="260" height="26" rx="4" fill="#f8f9fa" stroke="#444"/>
    <text x="92" y="130" fill="#222">id</text>
    <rect x="80" y="146" width="260" height="26" rx="4" fill="#f8f9fa" stroke="#444"/>
    <text x="92" y="164" fill="#222">amount</text>
    <rect x="80" y="180" width="260" height="26" rx="4" fill="#f8f9fa" stroke="#444"/>
    <text x="92" y="198" fill="#222">currency</text>
    <rect x="80" y="214" width="260" height="26" rx="4" fill="#f8f9fa" stroke="#444"/>
    <text x="92" y="232" fill="#222">status</text>
    <!-- fields added later -->
    <rect x="80" y="256" width="260" height="26" rx="4" fill="#fff" stroke="#e88a55" stroke-width="2"/>
    <text x="92" y="274" fill="#b35c2a">fee_breakdown</text>
    <rect x="80" y="290" width="260" height="26" rx="4" fill="#fff" stroke="#e88a55" stroke-width="2"/>
    <text x="92" y="308" fill="#b35c2a">risk_score</text>
  </g>
  <text x="335" y="250" font-size="12" fill="#b35c2a" font-weight="600" text-anchor="end">added later ↓</text>

  <!-- connectors: extracted fields -->
  <g stroke="#5fb49c" stroke-width="2">
    <line x1="360" y1="125" x2="632" y2="125" marker-end="url(#tr-arrow-teal)"/>
    <line x1="360" y1="159" x2="632" y2="159" marker-end="url(#tr-arrow-teal)"/>
    <line x1="360" y1="193" x2="632" y2="193" marker-end="url(#tr-arrow-teal)"/>
    <line x1="360" y1="227" x2="632" y2="227" marker-end="url(#tr-arrow-teal)"/>
  </g>
  <text x="500" y="112" font-size="13" fill="#3d8a75" font-weight="600" text-anchor="middle">extracted by name</text>

  <!-- connectors: ignored fields -->
  <g stroke="#999" stroke-width="2" stroke-dasharray="5 5">
    <line x1="360" y1="269" x2="490" y2="269"/>
    <line x1="360" y1="303" x2="490" y2="303"/>
  </g>
  <text x="502" y="273" font-size="13" fill="#666" font-weight="600">ignored</text>
  <text x="502" y="307" font-size="13" fill="#666" font-weight="600">ignored</text>

  <!-- Reader box -->
  <rect x="640" y="46" width="300" height="296" rx="8" fill="#fff" stroke="#5fb49c" stroke-width="2.5"/>
  <text x="790" y="76" font-size="16" fill="#3d8a75" font-weight="700" text-anchor="middle">Tolerant Reader</text>
  <text x="790" y="96" font-size="12" fill="#555" text-anchor="middle">shop consumer — reads only what it uses</text>

  <g font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="660" y="112" width="260" height="26" rx="4" fill="#eef7f4" stroke="#5fb49c"/>
    <text x="672" y="130" fill="#222">id</text>
    <rect x="660" y="146" width="260" height="26" rx="4" fill="#eef7f4" stroke="#5fb49c"/>
    <text x="672" y="164" fill="#222">amount</text>
    <rect x="660" y="180" width="260" height="26" rx="4" fill="#eef7f4" stroke="#5fb49c"/>
    <text x="672" y="198" fill="#222">currency</text>
    <rect x="660" y="214" width="260" height="26" rx="4" fill="#eef7f4" stroke="#5fb49c"/>
    <text x="672" y="232" fill="#222">status</text>
  </g>
  <text x="672" y="266" font-size="12.5" fill="#555">unknown fields → ignored</text>
  <text x="672" y="286" font-size="12.5" fill="#555">absent optional fields → explicit default</text>
  <text x="672" y="306" font-size="12.5" fill="#b35c2a">new enum value in a read field → error</text>
  <text x="672" y="330" font-size="12.5" fill="#3d8a75" font-weight="700">keeps working — no deployment</text>

  <!-- contract-test band -->
  <rect x="60" y="372" width="880" height="52" rx="8" fill="none" stroke="#682d63" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="500" y="403" font-size="13.5" fill="#682d63" font-weight="600" text-anchor="middle">consumer-driven contract tests pin the extracted field set — producers know what they must preserve</text>
</svg>
