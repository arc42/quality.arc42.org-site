<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 556" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',-apple-system,'Segoe UI',sans-serif" role="img" aria-labelledby="ic-title ic-desc">
  <title id="ic-title">Two tactics that increase cohesion</title>
  <desc id="ic-desc">Two before-and-after rows. Split a module: one Orders module holds pricing and invoicing responsibilities tangled together, then splits into a single-purpose Pricing module and a single-purpose Invoicing module. Redistribute responsibilities: a logging concern is scattered as a stray piece across three separate modules, then those pieces are gathered into one cohesive Logging module while the other modules keep only their own concern.</desc>

  <defs>
    <marker id="ic-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#682d63"/>
    </marker>
  </defs>

  <!-- heading -->
  <text x="460" y="34" font-size="21" fill="#682d63" font-weight="700" text-anchor="middle">Increase Cohesion</text>
  <text x="460" y="58" font-size="14" fill="#666" text-anchor="middle">group each module around one responsibility, so it has one reason to change</text>

  <!-- ================= Row 1 · Split a module ================= -->
  <text x="40" y="98" font-size="16" fill="#0077a3" font-weight="700">Split a module</text>
  <text x="40" y="118" font-size="12.5" fill="#888">one module pulled two ways → two single-purpose modules</text>

  <!-- before: tangled module -->
  <rect x="70" y="134" width="200" height="120" rx="10" fill="#fff" stroke="#999" stroke-width="1.8"/>
  <text x="170" y="158" font-size="14" fill="#555" font-weight="700" text-anchor="middle">Orders</text>
  <circle cx="120" cy="188" r="11" fill="#ffad80" stroke="#e88a55" stroke-width="1.6"/>
  <circle cx="220" cy="188" r="11" fill="#00b8f5" stroke="#0077a3" stroke-width="1.6"/>
  <circle cx="120" cy="222" r="11" fill="#00b8f5" stroke="#0077a3" stroke-width="1.6"/>
  <circle cx="220" cy="222" r="11" fill="#ffad80" stroke="#e88a55" stroke-width="1.6"/>
  <text x="170" y="246" font-size="11" fill="#999" text-anchor="middle">pricing + invoicing tangled</text>

  <!-- arrow -->
  <line x1="286" y1="194" x2="356" y2="194" stroke="#682d63" stroke-width="2.4" marker-end="url(#ic-arr)"/>
  <text x="321" y="184" font-size="12" fill="#682d63" text-anchor="middle">split</text>

  <!-- after: two cohesive modules -->
  <rect x="380" y="134" width="230" height="120" rx="10" fill="#fff" stroke="#e88a55" stroke-width="2.2"/>
  <text x="495" y="158" font-size="14" fill="#b05a24" font-weight="700" text-anchor="middle">Pricing</text>
  <circle cx="460" cy="200" r="11" fill="#ffad80" stroke="#e88a55" stroke-width="1.6"/>
  <circle cx="530" cy="200" r="11" fill="#ffad80" stroke="#e88a55" stroke-width="1.6"/>

  <rect x="630" y="134" width="230" height="120" rx="10" fill="#fff" stroke="#0077a3" stroke-width="2.2"/>
  <text x="745" y="158" font-size="14" fill="#0077a3" font-weight="700" text-anchor="middle">Invoicing</text>
  <circle cx="710" cy="200" r="11" fill="#00b8f5" stroke="#0077a3" stroke-width="1.6"/>
  <circle cx="780" cy="200" r="11" fill="#00b8f5" stroke="#0077a3" stroke-width="1.6"/>
  <text x="620" y="274" font-size="11" fill="#999" text-anchor="middle">each module, one reason to change</text>

  <!-- divider -->
  <line x1="40" y1="288" x2="880" y2="288" stroke="#eee" stroke-width="1.5"/>

  <!-- ============ Row 2 · Redistribute responsibilities ============ -->
  <text x="40" y="320" font-size="16" fill="#0077a3" font-weight="700">Redistribute responsibilities</text>
  <text x="40" y="340" font-size="12.5" fill="#888">one concern scattered across modules → gathered into one place</text>

  <!-- before: stray teal chip in each of three modules -->
  <g>
    <rect x="70"  y="356" width="96" height="86" rx="9" fill="#fff" stroke="#999" stroke-width="1.8"/>
    <rect x="182" y="356" width="96" height="86" rx="9" fill="#fff" stroke="#999" stroke-width="1.8"/>
    <rect x="294" y="356" width="96" height="86" rx="9" fill="#fff" stroke="#999" stroke-width="1.8"/>
    <circle cx="102" cy="399" r="10" fill="#d7d7d7" stroke="#999" stroke-width="1.4"/>
    <circle cx="214" cy="399" r="10" fill="#d7d7d7" stroke="#999" stroke-width="1.4"/>
    <circle cx="326" cy="399" r="10" fill="#d7d7d7" stroke="#999" stroke-width="1.4"/>
    <circle cx="134" cy="399" r="10" fill="#5fb49c" stroke="#2f6e5b" stroke-width="1.6"/>
    <circle cx="246" cy="399" r="10" fill="#5fb49c" stroke="#2f6e5b" stroke-width="1.6"/>
    <circle cx="358" cy="399" r="10" fill="#5fb49c" stroke="#2f6e5b" stroke-width="1.6"/>
  </g>
  <text x="230" y="462" font-size="11" fill="#999" text-anchor="middle">logging spread across three modules</text>

  <!-- arrow -->
  <line x1="404" y1="399" x2="474" y2="399" stroke="#682d63" stroke-width="2.4" marker-end="url(#ic-arr)"/>
  <text x="439" y="389" font-size="12" fill="#682d63" text-anchor="middle">gather</text>

  <!-- after: two clean modules + one cohesive logging module -->
  <rect x="498" y="356" width="96" height="86" rx="9" fill="#fff" stroke="#999" stroke-width="1.8"/>
  <circle cx="546" cy="399" r="10" fill="#d7d7d7" stroke="#999" stroke-width="1.4"/>
  <rect x="606" y="356" width="96" height="86" rx="9" fill="#fff" stroke="#999" stroke-width="1.8"/>
  <circle cx="654" cy="399" r="10" fill="#d7d7d7" stroke="#999" stroke-width="1.4"/>
  <rect x="720" y="356" width="150" height="86" rx="9" fill="#eaf6f2" stroke="#5fb49c" stroke-width="2.2"/>
  <text x="795" y="380" font-size="13.5" fill="#2f6e5b" font-weight="700" text-anchor="middle">Logging</text>
  <circle cx="758" cy="410" r="10" fill="#5fb49c" stroke="#2f6e5b" stroke-width="1.6"/>
  <circle cx="795" cy="410" r="10" fill="#5fb49c" stroke="#2f6e5b" stroke-width="1.6"/>
  <circle cx="832" cy="410" r="10" fill="#5fb49c" stroke="#2f6e5b" stroke-width="1.6"/>

  <!-- closing note -->
  <text x="460" y="500" font-size="14.5" fill="#444" font-weight="600" text-anchor="middle">a split for cohesion often lowers coupling too —</text>
  <text x="460" y="524" font-size="14.5" fill="#444" font-weight="600" text-anchor="middle">separated concerns stop reaching into each other</text>
</svg>
