<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',-apple-system,'Segoe UI',sans-serif" role="img" aria-labelledby="nv-title nv-desc">
  <title id="nv-title">N-version redundancy with majority voting</title>
  <desc id="nv-desc">The same input is sent to three independently built versions, A, B and C. Versions A and B each compute the correct result, 42. Version C carries a design fault and computes a wrong result, 99. All three outputs flow into a voter, which compares them, selects the majority value, and forwards 42 as the correct result. The single faulty output from Version C is outvoted and masked.</desc>

  <defs>
    <marker id="nv-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="nv-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc4444"/>
    </marker>
  </defs>

  <!-- heading -->
  <text x="460" y="34" font-size="21" fill="#682d63" font-weight="700" text-anchor="middle">N-Version Redundancy and Voting</text>
  <text x="460" y="58" font-size="14" fill="#666" text-anchor="middle">independently built versions compute the same result; a voter masks a single faulty output (TMR, N=3)</text>

  <!-- input -->
  <rect x="40" y="227" width="150" height="56" rx="10" fill="#eef7fb" stroke="#00b8f5" stroke-width="2.5"/>
  <text x="115" y="252" font-size="14" fill="#0077a3" font-weight="700" text-anchor="middle">same input</text>
  <text x="115" y="270" font-size="11" fill="#4a90ab" text-anchor="middle">to every version</text>

  <!-- fan-out arrows: input -> versions -->
  <line x1="190" y1="250" x2="248" y2="144" stroke="#444" stroke-width="2" marker-end="url(#nv-arr)"/>
  <line x1="190" y1="255" x2="248" y2="255" stroke="#444" stroke-width="2" marker-end="url(#nv-arr)"/>
  <line x1="190" y1="260" x2="248" y2="366" stroke="#444" stroke-width="2" marker-end="url(#nv-arr)"/>

  <!-- version A (green) -->
  <rect x="250" y="108" width="210" height="64" rx="10" fill="#eaf6f2" stroke="#5fb49c" stroke-width="2.5"/>
  <text x="270" y="135" font-size="15" fill="#2f6e5b" font-weight="700">Version A</text>
  <text x="270" y="155" font-size="12" fill="#5a8b7c">independent build</text>

  <!-- version B (blue) -->
  <rect x="250" y="223" width="210" height="64" rx="10" fill="#eef7fb" stroke="#00b8f5" stroke-width="2.5"/>
  <text x="270" y="250" font-size="15" fill="#0077a3" font-weight="700">Version B</text>
  <text x="270" y="270" font-size="12" fill="#4a90ab">independent build</text>

  <!-- version C (orange, faulty) -->
  <rect x="250" y="338" width="210" height="64" rx="10" fill="#fff3e8" stroke="#e88a55" stroke-width="2.5"/>
  <text x="270" y="365" font-size="15" fill="#b05a24" font-weight="700">Version C</text>
  <text x="270" y="385" font-size="12" fill="#cc4444" font-weight="700">design fault</text>

  <!-- version -> output arrows -->
  <line x1="460" y1="140" x2="488" y2="140" stroke="#444" stroke-width="2" marker-end="url(#nv-arr)"/>
  <line x1="460" y1="255" x2="488" y2="255" stroke="#444" stroke-width="2" marker-end="url(#nv-arr)"/>
  <line x1="460" y1="370" x2="488" y2="370" stroke="#cc4444" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#nv-red)"/>

  <!-- output chips -->
  <rect x="490" y="122" width="60" height="36" rx="8" fill="#fff" stroke="#9ccbbb" stroke-width="2"/>
  <text x="520" y="146" font-size="15" fill="#2f6e5b" font-weight="700" text-anchor="middle">42</text>
  <rect x="490" y="237" width="60" height="36" rx="8" fill="#fff" stroke="#7cc3e8" stroke-width="2"/>
  <text x="520" y="261" font-size="15" fill="#0077a3" font-weight="700" text-anchor="middle">42</text>
  <rect x="490" y="352" width="60" height="36" rx="8" fill="#fdecec" stroke="#cc4444" stroke-width="2"/>
  <text x="520" y="376" font-size="15" fill="#cc4444" font-weight="700" text-anchor="middle">99</text>

  <!-- output -> voter arrows (fan-in) -->
  <line x1="550" y1="140" x2="606" y2="233" stroke="#444" stroke-width="2" marker-end="url(#nv-arr)"/>
  <line x1="550" y1="255" x2="606" y2="255" stroke="#444" stroke-width="2" marker-end="url(#nv-arr)"/>
  <line x1="550" y1="370" x2="606" y2="277" stroke="#cc4444" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#nv-red)"/>

  <!-- voter -->
  <rect x="610" y="213" width="130" height="84" rx="12" fill="#faf5f9" stroke="#682d63" stroke-width="2.5"/>
  <text x="675" y="250" font-size="16" fill="#682d63" font-weight="700" text-anchor="middle">Voter</text>
  <text x="675" y="272" font-size="12" fill="#666" text-anchor="middle">compares, picks</text>
  <text x="675" y="287" font-size="12" fill="#666" text-anchor="middle">the majority</text>

  <!-- voter -> result -->
  <line x1="740" y1="255" x2="788" y2="255" stroke="#444" stroke-width="2" marker-end="url(#nv-arr)"/>

  <!-- result -->
  <rect x="790" y="227" width="110" height="56" rx="10" fill="#eaf6f2" stroke="#5fb49c" stroke-width="2.5"/>
  <text x="845" y="252" font-size="18" fill="#2f6e5b" font-weight="700" text-anchor="middle">42</text>
  <text x="845" y="272" font-size="11" fill="#5a8b7c" text-anchor="middle">correct result</text>

  <!-- caption -->
  <text x="460" y="440" font-size="13" fill="#666" text-anchor="middle">A single faulty output (99) is outvoted — the voter forwards the correct majority (42), masking the fault.</text>
</svg>
