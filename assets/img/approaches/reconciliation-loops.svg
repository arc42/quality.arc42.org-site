<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Reconciliation loop drives current state toward desired state</title>
  <desc id="desc">A declarative state store supplies desired state to a controller. The controller observes managed resources, compares desired and current state, applies idempotent corrections, reports status, and repeats until the states converge.</desc>
  <defs>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#682d63"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f806d"/>
    </marker>
    <style>
      .heading { font: 700 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2d2530; }
      .label { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2d2530; }
      .small { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #554b57; }
      .tiny { font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #554b57; }
      .flow { fill: none; stroke: #682d63; stroke-width: 3; marker-end: url(#arrow-violet); }
      .feedback { fill: none; stroke: #2f806d; stroke-width: 3; marker-end: url(#arrow-teal); }
    </style>
  </defs>

  <rect width="1120" height="430" rx="22" fill="#f8f9fa"/>
  <text x="560" y="38" text-anchor="middle" class="heading">Desired state becomes a continuous control loop</text>

  <g aria-label="Declarative state store">
    <rect x="42" y="92" width="280" height="244" rx="18" fill="#ffffff" stroke="#682d63" stroke-width="3"/>
    <rect x="42" y="92" width="280" height="54" rx="18" fill="#682d63"/>
    <path d="M42 128h280v18H42z" fill="#682d63"/>
    <text x="182" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Declarative state store</text>

    <text x="68" y="180" class="label">Spec</text>
    <text x="68" y="205" class="small">replicas: 3</text>
    <text x="68" y="227" class="small">policy: version 7</text>
    <text x="68" y="249" class="tiny">written by the owner</text>

    <line x1="64" y1="267" x2="300" y2="267" stroke="#d7d0d7" stroke-width="2"/>
    <text x="68" y="298" class="label">Status</text>
    <text x="142" y="298" class="small">2 replicas • version 6</text>
    <text x="68" y="320" class="tiny">written by the controller</text>
  </g>

  <g aria-label="Controller reconciliation loop">
    <circle cx="557" cy="215" r="132" fill="#ffffff"/>
    <circle cx="557" cy="215" r="58" fill="#e8f5f1" stroke="#2f806d" stroke-width="2"/>
    <text x="557" y="210" text-anchor="middle" class="label">Controller</text>
    <text x="557" y="233" text-anchor="middle" class="small">reconcile()</text>

    <rect x="496" y="95" width="122" height="38" rx="19" fill="#dff6ff" stroke="#00b8f5" stroke-width="2"/>
    <text x="557" y="120" text-anchor="middle" class="label">Observe</text>

    <rect x="627" y="180" width="116" height="38" rx="19" fill="#f2e9f1" stroke="#682d63" stroke-width="2"/>
    <text x="685" y="205" text-anchor="middle" class="label">Compare</text>

    <rect x="502" y="299" width="110" height="38" rx="19" fill="#fff0e8" stroke="#e88a55" stroke-width="2"/>
    <text x="557" y="324" text-anchor="middle" class="label">Act</text>

    <rect x="370" y="180" width="118" height="38" rx="19" fill="#e8f5f1" stroke="#2f806d" stroke-width="2"/>
    <text x="429" y="205" text-anchor="middle" class="label">Report</text>

    <path d="M618 112 C674 124 711 148 718 180" class="feedback"/>
    <path d="M685 218 C681 270 643 306 612 315" class="feedback"/>
    <path d="M502 318 C450 299 420 258 425 218" class="feedback"/>
    <path d="M429 180 C449 133 480 116 496 113" class="feedback"/>
  </g>

  <g aria-label="Managed resources">
    <rect x="798" y="92" width="280" height="244" rx="18" fill="#ffffff" stroke="#00b8f5" stroke-width="3"/>
    <rect x="798" y="92" width="280" height="54" rx="18" fill="#00b8f5"/>
    <path d="M798 128h280v18H798z" fill="#00b8f5"/>
    <text x="938" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#142e38">Managed resources</text>

    <g transform="translate(830 177)">
      <rect width="66" height="58" rx="9" fill="#e8f5f1" stroke="#2f806d" stroke-width="2"/>
      <circle cx="14" cy="15" r="5" fill="#2f806d"/>
      <text x="33" y="39" text-anchor="middle" class="tiny">replica 1</text>
    </g>
    <g transform="translate(907 177)">
      <rect width="66" height="58" rx="9" fill="#e8f5f1" stroke="#2f806d" stroke-width="2"/>
      <circle cx="14" cy="15" r="5" fill="#2f806d"/>
      <text x="33" y="39" text-anchor="middle" class="tiny">replica 2</text>
    </g>
    <g transform="translate(984 177)">
      <rect width="66" height="58" rx="9" fill="#fff0e8" stroke="#e88a55" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="33" y="25" text-anchor="middle" class="tiny">missing</text>
      <text x="33" y="43" text-anchor="middle" class="tiny">replica 3</text>
    </g>
    <text x="938" y="275" text-anchor="middle" class="label">Observed: policy v6</text>
    <text x="938" y="301" text-anchor="middle" class="small">Correction → create replica, apply v7</text>
  </g>

  <path d="M322 163 C357 142 387 132 420 130" class="flow"/>
  <text x="367" y="116" text-anchor="middle" class="tiny">read intent</text>

  <path d="M798 164 C766 142 736 131 704 128" class="feedback"/>
  <text x="752" y="116" text-anchor="middle" class="tiny">observe current</text>

  <path d="M689 285 C733 310 763 309 798 287" class="flow"/>
  <text x="744" y="334" text-anchor="middle" class="tiny">idempotent correction</text>

  <path d="M370 255 C350 273 335 287 322 297" class="feedback"/>
  <text x="354" y="321" text-anchor="middle" class="tiny">write status</text>

  <rect x="354" y="372" width="406" height="38" rx="19" fill="#e8f5f1" stroke="#2f806d" stroke-width="2"/>
  <text x="557" y="397" text-anchor="middle" class="label">Repeat until observed state matches intent</text>
</svg>
