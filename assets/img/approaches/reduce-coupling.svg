<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 548" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',-apple-system,'Segoe UI',sans-serif" role="img" aria-labelledby="rc-title rc-desc">
  <title id="rc-title">Four tactics that reduce coupling</title>
  <desc id="rc-desc">A two-by-two grid of coupling-reduction tactics. Encapsulate: module A depends on an explicit interface, behind which module B's internals stay hidden. Use an intermediary: a broker sits between A and B so neither names the other directly. Restrict dependencies: a UI, domain, and data layer where each layer may call only the one below, and a skip from UI straight to data is forbidden. Abstract common services: A binds to one shared contract that fans out to three interchangeable providers.</desc>

  <defs>
    <marker id="rc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="rc-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc4444"/>
    </marker>
  </defs>

  <!-- heading -->
  <text x="460" y="34" font-size="21" fill="#682d63" font-weight="700" text-anchor="middle">Reduce Coupling</text>
  <text x="460" y="58" font-size="14" fill="#666" text-anchor="middle">four tactics that turn a direct, wide dependency into a narrow, indirect one</text>

  <!-- cards -->
  <rect x="30"  y="84"  width="420" height="210" rx="12" fill="#fff" stroke="#e2e2e2"/>
  <rect x="470" y="84"  width="420" height="210" rx="12" fill="#fff" stroke="#e2e2e2"/>
  <rect x="30"  y="316" width="420" height="210" rx="12" fill="#fff" stroke="#e2e2e2"/>
  <rect x="470" y="316" width="420" height="210" rx="12" fill="#fff" stroke="#e2e2e2"/>

  <!-- 1 · Encapsulate -->
  <text x="54" y="118" font-size="16" fill="#0077a3" font-weight="700">1 · Encapsulate</text>
  <rect x="60" y="178" width="56" height="34" rx="6" fill="#f8f9fa" stroke="#00b8f5" stroke-width="2.5"/>
  <text x="88" y="200" font-size="14" fill="#0077a3" font-weight="700" text-anchor="middle">A</text>
  <line x1="116" y1="195" x2="172" y2="195" stroke="#444" stroke-width="2" marker-end="url(#rc-arr)"/>
  <rect x="176" y="168" width="22" height="54" rx="3" fill="#eaf6f2" stroke="#5fb49c" stroke-width="2.5"/>
  <text x="187" y="238" font-size="10.5" fill="#2f6e5b" text-anchor="middle">interface</text>
  <line x1="198" y1="195" x2="240" y2="195" stroke="#5fb49c" stroke-width="2"/>
  <rect x="240" y="164" width="160" height="62" rx="8" fill="#eaf6f2" stroke="#5fb49c" stroke-width="2.5"/>
  <text x="266" y="188" font-size="14" fill="#2f6e5b" font-weight="700">B</text>
  <rect x="296" y="176" width="92" height="38" rx="4" fill="none" stroke="#9ccbbb" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="342" y="200" font-size="10.5" fill="#7aa596" text-anchor="middle">internals</text>
  <text x="54" y="276" font-size="12.5" fill="#666">dependents bind to the interface; internals stay free to change</text>

  <!-- 2 · Use an intermediary -->
  <text x="494" y="118" font-size="16" fill="#0077a3" font-weight="700">2 · Use an intermediary</text>
  <rect x="500" y="178" width="56" height="34" rx="6" fill="#f8f9fa" stroke="#00b8f5" stroke-width="2.5"/>
  <text x="528" y="200" font-size="14" fill="#0077a3" font-weight="700" text-anchor="middle">A</text>
  <line x1="556" y1="195" x2="664" y2="195" stroke="#444" stroke-width="2" marker-end="url(#rc-arr)"/>
  <polygon points="700,166 734,195 700,224 666,195" fill="#fff3e8" stroke="#e88a55" stroke-width="2.5"/>
  <text x="700" y="199" font-size="10.5" fill="#b05a24" font-weight="700" text-anchor="middle">broker</text>
  <line x1="736" y1="195" x2="798" y2="195" stroke="#444" stroke-width="2" marker-end="url(#rc-arr)"/>
  <rect x="800" y="178" width="56" height="34" rx="6" fill="#eaf6f2" stroke="#5fb49c" stroke-width="2.5"/>
  <text x="828" y="200" font-size="14" fill="#2f6e5b" font-weight="700" text-anchor="middle">B</text>
  <text x="494" y="276" font-size="12.5" fill="#666">a broker or bus breaks the direct A-to-B dependency</text>

  <!-- 3 · Restrict dependencies -->
  <text x="54" y="350" font-size="16" fill="#0077a3" font-weight="700">3 · Restrict dependencies</text>
  <rect x="150" y="360" width="180" height="30" rx="5" fill="#f8f9fa" stroke="#00b8f5" stroke-width="2"/>
  <text x="240" y="380" font-size="12.5" fill="#0077a3" text-anchor="middle">UI layer</text>
  <rect x="150" y="402" width="180" height="30" rx="5" fill="#eef7fb" stroke="#00b8f5" stroke-width="2"/>
  <text x="240" y="422" font-size="12.5" fill="#0077a3" text-anchor="middle">domain layer</text>
  <rect x="150" y="444" width="180" height="30" rx="5" fill="#eaf6f2" stroke="#5fb49c" stroke-width="2"/>
  <text x="240" y="464" font-size="12.5" fill="#2f6e5b" text-anchor="middle">data layer</text>
  <line x1="240" y1="390" x2="240" y2="401" stroke="#444" stroke-width="2" marker-end="url(#rc-arr)"/>
  <line x1="240" y1="432" x2="240" y2="443" stroke="#444" stroke-width="2" marker-end="url(#rc-arr)"/>
  <path d="M330,372 C388,398 388,436 332,461" fill="none" stroke="#cc4444" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#rc-red)"/>
  <text x="392" y="421" font-size="16" fill="#cc4444" font-weight="700" text-anchor="middle">✕</text>
  <text x="54" y="506" font-size="12.5" fill="#666">each layer may call only the one below — no skips, no cycles</text>

  <!-- 4 · Abstract common services -->
  <text x="494" y="350" font-size="16" fill="#0077a3" font-weight="700">4 · Abstract common services</text>
  <rect x="500" y="402" width="56" height="34" rx="6" fill="#f8f9fa" stroke="#00b8f5" stroke-width="2.5"/>
  <text x="528" y="424" font-size="14" fill="#0077a3" font-weight="700" text-anchor="middle">A</text>
  <line x1="556" y1="419" x2="608" y2="419" stroke="#444" stroke-width="2" marker-end="url(#rc-arr)"/>
  <rect x="610" y="396" width="30" height="46" rx="4" fill="#eaf6f2" stroke="#5fb49c" stroke-width="2.5"/>
  <text x="625" y="458" font-size="10.5" fill="#2f6e5b" text-anchor="middle">one contract</text>
  <line x1="640" y1="411" x2="738" y2="377" stroke="#444" stroke-width="2" marker-end="url(#rc-arr)"/>
  <line x1="640" y1="419" x2="738" y2="419" stroke="#444" stroke-width="2" marker-end="url(#rc-arr)"/>
  <line x1="640" y1="427" x2="738" y2="461" stroke="#444" stroke-width="2" marker-end="url(#rc-arr)"/>
  <rect x="740" y="360" width="120" height="30" rx="5" fill="#fff" stroke="#999" stroke-width="1.6"/>
  <text x="800" y="380" font-size="12.5" fill="#555" text-anchor="middle">provider 1</text>
  <rect x="740" y="404" width="120" height="30" rx="5" fill="#fff" stroke="#999" stroke-width="1.6"/>
  <text x="800" y="424" font-size="12.5" fill="#555" text-anchor="middle">provider 2</text>
  <rect x="740" y="448" width="120" height="30" rx="5" fill="#fff" stroke="#999" stroke-width="1.6"/>
  <text x="800" y="468" font-size="12.5" fill="#555" text-anchor="middle">provider 3</text>
  <text x="494" y="506" font-size="12.5" fill="#666">dependents bind once to the contract, not per provider</text>
</svg>
